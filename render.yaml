services:
  # Emertech Certify Clean-Room Backend API
  - type: web
    name: emertech-certify-backend
    env: node
    plan: free
    region: oregon
    buildCommand: cd cleanroom/backend && npm ci --only=production
    startCommand: cd cleanroom/backend && node src/server.js
    healthCheckPath: /api/v2/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: KEY_VAULT_SECRET
        generateValue: true
      - key: OFFCHAIN_DEMO
        value: "true"

  # Emertech Certify Clean-Room Frontend SPA
  - type: web
    name: emertech-certify-frontend
    env: static
    plan: free
    region: oregon
    buildCommand: cd cleanroom/frontend && npm ci --legacy-peer-deps && npm run build
    staticPublishPath: cleanroom/frontend/build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: emertech-certify-backend
          property: host
