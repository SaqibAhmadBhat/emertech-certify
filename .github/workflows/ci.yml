name: Emertech Certify CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  contracts:
    name: Smart Contract Tests (Solidity ^0.8.20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install Contracts Dependencies
        run: |
          cd contracts
          npm ci

      - name: Compile Smart Contracts
        run: |
          cd contracts
          npx hardhat compile

      - name: Run Hardhat Test Suite (9/9 Tests)
        run: |
          cd contracts
          npm test

  backend:
    name: Backend API Integration Tests (Node.js & Express)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Setup Test Environment Variables
        run: |
          cd backend
          cp .env.example .env
          sed -i 's/PORT=5000/PORT=5001/' .env

      - name: Run Backend Integration Suite (13/13 Tests)
        run: |
          cd backend
          npm test

  frontend:
    name: Frontend Production Build (React 18 & Tailwind)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/certiport-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend/certiport-frontend
          npm ci --legacy-peer-deps

      - name: Build React Application
        env:
          CI: true
        run: |
          cd frontend/certiport-frontend
          npm run build
