name: Historical Prototype v1.0 Tests (Manual Trigger)

# =============================================================================
# EXPLANATION & ARCHITECTURAL SCOPE:
# This workflow is strictly for archival and pedagogical evaluation of the
# historical v1 prototype (inherited from Certiport and security-hardened).
# It is separated from the primary CI workflow to prevent legacy dependency
# overhead from blocking primary clean-room v2.0 development.
# =============================================================================

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Weekly run on Sundays

jobs:
  legacy-contracts:
    name: Historical v1 Contracts Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json
      - run: |
          cd contracts
          npm ci
          npx hardhat compile
          npm test

  legacy-backend:
    name: Historical v1 Backend API Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: |
          cd backend
          npm ci
          cp .env.example .env
          sed -i 's/PORT=5000/PORT=5001/' .env
          npm test

  legacy-frontend:
    name: Historical v1 Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/certiport-frontend/package-lock.json
      - run: |
          cd frontend/certiport-frontend
          npm ci --legacy-peer-deps
          CI=true npm run build

